name: Publicar imagem do backup (GHCR)

# Exclusivo do fork Hiperbold. Monta a imagem do serviço `backup` do EasyPanel
# (hiperbold/backup/): pg_dump 17 + age + rclone, que faz o backup diário do banco
# de produção, cifra e envia ao Google Drive. A VPS nunca compila: só puxa a imagem
# pronta (`ghcr.io/hiperbold/hiperbold-crm-backup:latest`).
#
# Só reage ao que muda a imagem. Não entra no deploy-easypanel.yml: o serviço
# `backup` é reiniciado à mão no EasyPanel quando a imagem muda.

on:
  push:
    branches: ["main"]
    paths:
      - "hiperbold/backup/**"
      - ".github/workflows/backup-image.yml"
  # Em PR a imagem é montada e o teste do script roda, sem publicar: um Dockerfile
  # ou script quebrado reprova ANTES do merge, nunca troca o `latest` do backup.
  pull_request:
    paths:
      - "hiperbold/backup/**"
      - ".github/workflows/backup-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  provar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Teste do script (sem rede e sem banco)
        run: bash -n hiperbold/backup/rodar.sh && bash hiperbold/backup/teste-rodar.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Montar a imagem sem publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: hiperbold/backup
          platforms: linux/amd64
          push: false
          load: true
          tags: teste-backup:pr
          cache-from: type=gha,scope=backup

      - name: A imagem recusa subir sem as variáveis
        run: |
          set +e
          saida="$(docker run --rm teste-backup:pr agora 2>&1)"; codigo=$?
          echo "$saida"
          [ "$codigo" -ne 0 ] && echo "$saida" | grep -q 'BACKUP FALHOU: AGE_RECIPIENT'

  publicar:
    needs: provar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SHA curto
        id: sha
        run: echo "curto=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: hiperbold/backup
          # linux/amd64: a VPS do EasyPanel é amd64.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hiperbold/hiperbold-crm-backup:latest
            ghcr.io/hiperbold/hiperbold-crm-backup:sha-${{ steps.sha.outputs.curto }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
