name: Deploy no EasyPanel (Hiperbold)

# Exclusivo do fork Hiperbold-Company/hiperbold-crm. Quando as três imagens do main foram
# publicadas no GHCR, pede ao EasyPanel para baixar e reiniciar app, worker e
# scheduler. A VPS nunca compila: só puxa a imagem pronta.
#
# Configuração no repositório (Settings > Secrets and variables > Actions):
#   secrets.EASYPANEL_URL, secrets.EASYPANEL_API_KEY
#   vars.EASYPANEL_PROJETO (hiperbold-crm-1)
# Sem elas o job falha alto em vez de passar verde sem deployar.
#
# O publish-image roda em PARALELO com o ci e o e2e: imagem publicada não prova
# que o commit passou nos testes (D-121). O primeiro passo decide se o commit
# pode ir para a produção, e o deploy manual (workflow_dispatch) passa pelo
# mesmo passo e só vale na main.
#
# ── OS TRÊS CAMINHOS, para quem mescla ─────────────────────────────────────────
# Mesclar SEMPRE com merge commit ("Create a merge commit"). Squash e rebase não
# passam pelo atalho e caem no caminho 3.
#
# 1. PR provado (o normal). O PR em dia com a main (sem "This branch is out of
#    date"), com ci.yml e e2e.yml verdes no head. Mesclado, o deploy sai assim
#    que as imagens publicam, sem esperar o reteste da main (~50 min a menos).
#    Lógica e condições: scripts/merge-ja-provado-no-pr.sh.
# 2. Rota urgente. Pôr o rótulo `urgente` no PR ANTES do push (ou rodar de novo
#    o ci e o e2e depois de pôr). No PR, o ci.yml pula a matriz do test:db e o
#    e2e.yml pula as partes; verify (typecheck+lint+test:unit) e o build
#    (perf.yml) rodam. Com ci.yml, perf.yml e o e2e (pulado pela regra) verdes e
#    o PR em dia com a main, o deploy sai sem as partes do e2e. PR que mexe em
#    supabase/, update.sh, docker-compose*.yml, hostgator-setup-kit/,
#    scripts/test-db*.sh, no próprio script da regra ou em ci.yml/e2e.yml NUNCA
#    vai pela rota urgente: o rótulo é ignorado e vale o caminho completo. O
#    script da regra é lido da BASE do PR, nunca do próprio PR.
#    Regra: scripts/pr-rota-urgente.sh.
# 3. Sem prova pelo PR (squash, PR atrás da main, CI do PR vermelho ou
#    ilegível, push direto, deploy manual de commit sem PR). O deploy espera o
#    ci e o e2e do MESMO commit na main terminarem em sucesso e reprova se algum
#    não terminar assim: scripts/commit-passou-nos-testes.sh. O log do passo diz
#    qual condição do caminho 1/2 falhou. PR de fork cai sempre aqui.
#
# Em todos os caminhos, o último passo antes do EasyPanel confere que o commit
# AINDA é o topo da main (scripts/ainda-e-o-topo-da-main.sh). O EasyPanel não
# recebe sha, puxa a imagem mais recente; deploy de commit superado levaria o
# código mais novo com a prova do mais velho. Ele recusa, e o deploy do commit
# mais novo cuida da produção.
#
# Efeitos ACEITOS (revisão do PR #59), para não confundir com defeito:
#   - merges seguidos: o deploy do commit superado fica VERMELHO (recusa do
#     topo) e o reteste dele na main também pode ficar vermelho, porque o push
#     novo cancela os jobs pesados e o agregador lê `cancelled`. Não é falha do
#     código: confira o run do commit mais novo;
#   - cascata de superados: numa sequência rápida de merges, só o último é
#     medido inteiro na main e só ele deploya; os intermediários nunca têm
#     reteste completo próprio, e o alarme fica quieto para eles (o run foi
#     superado). Quem mede a árvore final é o reteste do último.
#
# Nos caminhos 1 e 2 o reteste da main continua rodando. Se ele falhar depois
# de o deploy ter saído, o alarme-reteste-da-main.yml abre uma issue
# "Reteste da main falhou depois do deploy: <sha>". Não há rollback automático:
# quem mesclou decide entre consertar para a frente ou reverter o merge.

# O sha no nome do run é o que o alarme lê para saber se o deploy deste commit
# saiu (scripts/alarme-reteste-da-main.sh): o head_sha de um run nascido de
# workflow_run não é, necessariamente, o commit publicado.
run-name: Deploy ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: ["Publicar imagem Docker (GHCR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  deploy:
    if: >-
      github.repository == 'Hiperbold-Company/hiperbold-crm' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    # O teto do portão é de 55 min (e2e em fila longa), mais o deploy.
    timeout-minutes: 65
    # Só leitura das execuções e dos PRs do próprio repositório, para o portão
    # consultar o ci, o e2e e o PR do merge. Escrita nenhuma.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # Só o script, não o repositório: o job guarda segredo de deploy e não deve
      # baixar nem rodar mais código do que o portão. Sem credencial gravada.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: |
            scripts/commit-passou-nos-testes.sh
            scripts/merge-ja-provado-no-pr.sh
            scripts/pr-rota-urgente.sh
            scripts/ainda-e-o-topo-da-main.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: O commit passou nos testes?
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::deploy manual só vale na main (ref: ${GITHUB_REF})"
            exit 1
          fi
          # Caminhos 1 e 2 (cabeçalho): merge de PR já provado sai sem esperar.
          if bash scripts/merge-ja-provado-no-pr.sh "${SHA}"; then
            exit 0
          fi
          # Caminho 3: espera o reteste da main deste commit.
          echo "sem prova pelo PR: espero o ci e o e2e da main para ${SHA}"
          bash scripts/commit-passou-nos-testes.sh "${SHA}"

      # Depois do portão (o caminho 3 pode ter esperado ~50 min) e antes do
      # EasyPanel: só o topo da main deploya. Ver o cabeçalho.
      - name: O commit ainda é o topo da main?
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/ainda-e-o-topo-da-main.sh "${SHA}"

      - name: Conferir configuração
        run: |
          test -n "${{ secrets.EASYPANEL_URL }}"     || { echo "falta o segredo EASYPANEL_URL"; exit 1; }
          test -n "${{ secrets.EASYPANEL_API_KEY }}" || { echo "falta o segredo EASYPANEL_API_KEY"; exit 1; }
          test -n "${{ vars.EASYPANEL_PROJETO }}"    || { echo "falta a variavel EASYPANEL_PROJETO"; exit 1; }

      - name: Deploy de app, worker e scheduler
        run: |
          set -euo pipefail
          for servico in app worker scheduler; do
            echo "deploy: $servico"
            curl -sS --fail-with-body -X POST "${{ secrets.EASYPANEL_URL }}/api/trpc/services.app.deployService" \
              -H "Authorization: Bearer ${{ secrets.EASYPANEL_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"json\":{\"projectName\":\"${{ vars.EASYPANEL_PROJETO }}\",\"serviceName\":\"$servico\"}}" \
              > /dev/null
          done
          echo "deploy pedido para os três serviços"
